server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 50M;

    # Real visitor IP when behind Cloudflare / a reverse proxy
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PWA: always fresh
    location = /sw.js { add_header Cache-Control "no-cache" always; add_header Service-Worker-Allowed "/" always; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; try_files $uri =404; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
